    lore: |-
      <arrow> Right click to unleash its power
  daxi_regeneration:
    name: "<green>Daxi (R)"
    lore: |-
      <arrow> Right click to unleash its power
  vertical_polarizer:
    name: "Vertical Polarizer"
    lore: |-
      <arrow> Focuses Oscillator on vertical spins
      <arrow> Increased chance for vertical spin zots
  horizontal_polarizer:
    name: "Horizontal Polarizer"
    lore: |-
      <arrow> Focuses Oscillator on horizontal spins
      <arrow> Increased chance for horizontal spin zots
  nanobot_crafter:
    name: "Nanobot Crafter"
    lore: |-
      <star> Multiblocks
      <arrow> 1x <attr><lang:rebartranscendence.item.nanobot_launcher.name></attr>
      <arrow> 1x <attr><lang:rebartranscendence.item.nanobot_output_hatch.name></attr>
      <arrow> 1x End Rod
      <arrow> Allows particle manipulation
      <arrow> Right Click <attr><lang:rebartranscendence.item.nanobot_launcher.name></attr> to use
  nanobot_launcher:
    name: "Nanobot Launcher"
    lore: |-
      <arrow> Part of <attr><lang:rebartranscendence.item.nanobot_crafter.name></attr>
  nanobot_output_hatch:
    name: "Nanobot Output Hatch"
    lore: |-
      <arrow> Part of <attr><lang:rebartranscendence.item.nanobot_crafter.name></attr>
  quirp_oscillator:
    name: "Quirp Oscillator"
    lore: |-
      <arrow> Harnesses Quirps from the void
      <arrow> <attr><lang:pylon.fluid.obscyra/> usage:</attr> %fluid-per-craft% per seconds
      <arrow> <attr>Buffer:</attr> %buffer%
      <arrow> <red>Works only in the end!
    waila:
      running: "Quirp Oscillator | <green>Collecting <white>| Time left: <yellow>%time%<white> | %input-bar%"
      not_running: "Quirp Oscillator | Collected: %output% | %input-bar%"
      none_item: "No Quirp Collected"
  quirp_cycler:
    name: "Quirp Cycler"
    lore: |-
      <arrow> Rotates Quirps
      <arrow> <attr><lang:pylon.fluid.obscyra/> usage:</attr> %fluid-per-craft% per seconds
      <arrow> <attr>Buffer:</attr> %buffer%
  quirp_annihilator:
    name: "Quirp Annihilator"
    lore: |-
      <arrow> Use to produce <attr><lang:rebartranscendence.item.quirp_condensate.name></attr>
      <arrow> Condesates opposite Quirps
      <arrow> <attr><lang:pylon.fluid.obscyra/> usage:</attr> %fluid-per-craft% per seconds
      <arrow> <attr>Buffer:</attr> %buffer%
  stabilizer:
    name: "Stabilizer"
    lore: |-
      <arrow> A controlled environment
      <arrow> <attr><lang:pylon.fluid.obscyra/> usage:</attr> %fluid-per-craft% per seconds
      <arrow> <attr>Buffer:</attr> %buffer%
  zot_overloader:
    name: "Zot Overloader"
    lore: |-
      <arrow> Even higher power concentrations
      <arrow> Require 1 of same direction quirp or %diff% of different direction quirp to charge a point
      <arrow> <attr><lang:pylon.fluid.obscyra/> usage:</attr> %fluid-per-craft% per works
      <arrow> <attr>Buffer:</attr> %buffer%
      <arrow> <red>Works only in the end!
